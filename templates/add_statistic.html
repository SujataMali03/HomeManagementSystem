<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Statistic</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        Add Statistic
    </div>

    <nav>

        <a href="{{ url_for('manage_statistics') }}">
            Back to Statistics
        </a>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

    </nav>

</header>


<section class="form-section">

    <div class="form-box">

        <h1>Add New Statistic</h1>

        <form method="POST">

            <label for="label">
                Statistic Label
            </label>

            <input
                type="text"
                id="label"
                name="label"
                placeholder="Example: Students Educated"
                required>


            <label for="value">
                Statistic Value
            </label>

            <input
                type="text"
                id="value"
                name="value"
                placeholder="Example: 10,000+"
                required>


            <label for="display_order">
                Display Order
            </label>

            <input
                type="number"
                id="display_order"
                name="display_order"
                value="1"
                min="1"
                required>


            <label for="status">
                Status
            </label>

            <select id="status" name="status">

                <option value="1">
                    Active
                </option>

                <option value="0">
                    Inactive
                </option>

            </select>


            <button type="submit">
                Save Statistic
            </button>

        </form>

    </div>

</section>

</body>

</html>
