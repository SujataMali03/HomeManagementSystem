<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Statistic</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        Edit Statistic
    </div>

    <nav>

        <a href="{{ url_for('manage_statistics') }}">
            Back to Statistics
        </a>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('admin_logout') }}">
            Logout
        </a>

    </nav>

</header>


<section class="form-section">

    <div class="form-box">

        <h1>Edit Statistic</h1>

        <form method="POST">

            <label for="label">
                Statistic Label
            </label>

            <input
                type="text"
                id="label"
                name="label"
                value="{{ statistic['label'] }}"
                required>


            <label for="value">
                Statistic Value
            </label>

            <input
                type="text"
                id="value"
                name="value"
                value="{{ statistic['value'] }}"
                required>


            <label for="display_order">
                Display Order
            </label>

            <input
                type="number"
                id="display_order"
                name="display_order"
                value="{{ statistic['display_order'] }}"
                min="1"
                required>


            <label for="status">
                Status
            </label>

            <select id="status" name="status">

                <option
                    value="1"
                    {% if statistic['status'] == 1 %}
                    selected
                    {% endif %}>
                    Active
                </option>

                <option
                    value="0"
                    {% if statistic['status'] == 0 %}
                    selected
                    {% endif %}>
                    Inactive
                </option>

            </select>


            <button type="submit">
                Update Statistic
            </button>

        </form>

    </div>

</section>

</body>

</html>
