<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Banner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <div class="logo">
            Edit Banner
        </div>

        <nav>
            <a href="{{ url_for('manage_banners') }}">Back to Banners</a>
            <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin_logout') }}">Logout</a>
        </nav>

    </header>


    <section class="form-section">

        <div class="form-box">

            <h1>Edit Banner</h1>

            <form method="POST">

                <label for="title">
                    Banner Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ banner['title'] }}"
                    required>


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5">{{ banner['description'] }}</textarea>


                <label for="image_url">
                    Image URL
                </label>

                <input
                    type="url"
                    id="image_url"
                    name="image_url"
                    value="{{ banner['image_url'] }}"
                    required>


                <label for="display_order">
                    Display Order
                </label>

                <input
                    type="number"
                    id="display_order"
                    name="display_order"
                    value="{{ banner['display_order'] }}"
                    min="1"
                    required>


                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status">

                    <option
                        value="1"
                        {% if banner['status'] == 1 %}selected{% endif %}>
                        Active
                    </option>

                    <option
                        value="0"
                        {% if banner['status'] == 0 %}selected{% endif %}>
                        Inactive
                    </option>

                </select>


                <button type="submit">
                    Update Banner
                </button>

            </form>

        </div>

    </section>

</body>

</html>
